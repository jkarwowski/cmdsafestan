[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdsafestan"
version = "0.1.0"
description = "SafeStan-first CmdStan command wrapper."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cmdsafestan = "cmdsafestan.cli:main"
cmdsafestan-api = "cmdsafestan.api:main"

[tool.setuptools]
packages = ["cmdsafestan"]

[tool.uv]
package = true
